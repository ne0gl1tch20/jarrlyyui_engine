name: Validate JUI engine

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Flutter package validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/jarrlyyui_engine
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
